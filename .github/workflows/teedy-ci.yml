name: Teedy-CI
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
      - name: 配置JDK11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: Maven打包
        run: mvn clean package -DskipTests
      - name: PMD代码扫描
        run: mvn pmd:pmd
      - name: 单元测试
        run: mvn test
      - name: 生成测试报告
        run: mvn surefire-report:report
      - name: 生成JavaDoc
        run: mvn javadoc:jar
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            target/*.jar
            target/site/