name: Teedy-CI
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置JDK11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      #【第一段：阿里云镜像配置，放在jdk下面】
      - name: 配置阿里Maven镜像
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
<settings>
<mirrors>
<mirror>
<id>aliyun</id>
<mirrorOf>*</mirrorOf>
<url>https://maven.aliyun.com/repository/public</url>
</mirror>
</mirrors>
</settings>
EOF

      #【第二段：依赖缓存】
      - name: 缓存Maven依赖
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}

      #【第三段：打包命令】
      - name: Maven打包
        run: mvn clean package -DskipTests -Dpmd.skip=true -pl docs-web -am -T1.5C -nsu